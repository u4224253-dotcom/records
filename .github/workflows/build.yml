name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak project
        run: unzip -q LayKit.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: LayKit
        run: gradle assembleDebug --no-daemon

      - name: Ganti nama APK
        run: cp LayKit/app/build/outputs/apk/debug/app-debug.apk LayKit/LayKit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LayKit-debug-apk
          path: LayKit/LayKit.apk
